name: CI

on:
  pull_request:
  workflow_call:
    # Strings, not booleans: on pull_request the inputs are absent, and only a string compare keeps both suites on then.
    inputs:
      brain-integration:
        type: string
        default: 'true'
      spider-integration:
        type: string
        default: 'true'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Throwaway database for the integration tests; it only lives for this job.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: automatedlinkedin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d automatedlinkedin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      rabbitmq:
        image: rabbitmq:4.3-alpine
        env:
          RABBITMQ_DEFAULT_USER: automatedlinkedin
          RABBITMQ_DEFAULT_PASS: automatedlinkedin
          RABBITMQ_DEFAULT_VHOST: automatedlinkedin
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10
          --health-start-period 20s
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm ts:check

      - run: pnpm test:unit:run

      # Straight through pnpm: Turborepo strict env mode would hide DATABASE_URL from the task.
      - name: Apply database migrations
        if: inputs.brain-integration != 'false'
        run: pnpm --filter @automatedLinkedIn/brain db:migrate:deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/automatedlinkedin

      - name: Integration tests
        if: inputs.brain-integration != 'false'
        run: pnpm --filter @automatedLinkedIn/brain test:integration:run
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/automatedlinkedin
          RABBITMQ_URL: amqp://automatedlinkedin:automatedlinkedin@localhost:5672/automatedlinkedin

      # The broker is only used by these tests, so purging its queues is safe in CI.
      - name: Spider integration tests
        if: inputs.spider-integration != 'false'
        run: pnpm --filter @automatedLinkedIn/spider test:integration:run
        env:
          NODE_ENV: test
          RABBITMQ_URL: amqp://automatedlinkedin:automatedlinkedin@localhost:5672/automatedlinkedin

      - run: pnpm build

