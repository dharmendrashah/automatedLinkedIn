name: CI

on:
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Throwaway database for the integration tests; it only lives for this job.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: automatedlinkedin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d automatedlinkedin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      rabbitmq:
        image: rabbitmq:4.3-alpine
        env:
          RABBITMQ_DEFAULT_USER: automatedlinkedin
          RABBITMQ_DEFAULT_PASS: automatedlinkedin
          RABBITMQ_DEFAULT_VHOST: automatedlinkedin
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10
          --health-start-period 20s
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm ts:check

      - run: pnpm test:unit:run

      # Straight through pnpm: Turborepo strict env mode would hide DATABASE_URL from the task.
      - name: Apply database migrations
        run: pnpm --filter @automatedLinkedIn/brain db:migrate:deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/automatedlinkedin

      - name: Integration tests
        run: pnpm --filter @automatedLinkedIn/brain test:integration:run
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/automatedlinkedin
          RABBITMQ_URL: amqp://automatedlinkedin:automatedlinkedin@localhost:5672/automatedlinkedin

      - run: pnpm build

  publish:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: [brain, body]
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Resolve lowercase image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.app }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4.4.1

      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=edge
            type=sha

      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
