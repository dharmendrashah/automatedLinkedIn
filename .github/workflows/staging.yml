name: Staging images

# Builds the images the staging overlay deploys:
#   -brain          the API
#   -brain-migrate  the `migrate` Dockerfile stage, run as brain's init container
#   -body           the SPA, which bakes its VITE_* values at build time and is
#                   therefore environment specific
#   -spider         the spider API (apps/spider Dockerfile's `api` target)
#   -spider-worker  the Camoufox worker (apps/spider Dockerfile's `worker` target)
#
# -spider is built and pushed to GHCR, but the staging overlay does not deploy it (deploy/overlays/staging/kustomization.yaml).
# -spider-worker is pushed to GHCR and to Artifact Registry: the Cloud Run job (infra/cloud-run) runs that copy, and the
# deploy job applies it with deploy/scripts/spider-job.sh, failing unless the job is ready on this commit's image.
#
# Configure these repository variables before the first run:
#   STAGING_API_URL   https://api.staging.<domain>
#   STAGING_AUTH_URL  https://auth.staging.<domain>
#   GCP_PROJECT_ID / GKE_CLUSTER / GKE_LOCATION           (deploy job)
#   GCP_WORKLOAD_IDENTITY_PROVIDER / GCP_SERVICE_ACCOUNT  (deploy job)
#
# And these repository secrets:
#   STAGING_CONFIG_ENV   full contents of deploy/overlays/staging/config.env
#   STAGING_SECRETS_ENV  full contents of deploy/overlays/staging/secrets.env
#   CF_API_TOKEN         Cloudflare token with Zone -> DNS -> Edit on elitale.com (keeps staging DNS current)
#   PULUMI_CONFIG_PASSPHRASE  passphrase of the Pulumi state in gs://<project>-pulumi-state (deploy/gcp-setup.md)
#
# GCP authentication is keyless (Workload Identity Federation), so there is no
# service account key to store or rotate. See deploy/README.md.

on:
  workflow_dispatch:
  push:
    branches: [main]
    # Everything deploys except docs and example files. workflow_dispatch ignores this filter.
    paths-ignore:
      - '**/*.md'
      - '.plan/**'
      - 'LICENSE'
      - '**/*.example.env'

# Runs queue up instead of cancelling each other: a cancelled deploy can leave the Pulumi stack locked (spider-job.sh clears a
# stale lock, but a run that is queued is cleaner than one that is killed in the middle of an apply).
concurrency:
  group: staging-images
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/ci.yml

  publish:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: brain
            suffix: brain
            target: ''
          - app: brain
            suffix: brain-migrate
            target: migrate
          - app: body
            suffix: body
            target: ''
          - app: spider
            suffix: spider
            target: api
          - app: spider
            suffix: spider-worker
            target: worker
    steps:
      - uses: actions/checkout@v7.0.1

      # Recorded in the image and reported by GET /health, so a deploy can be confirmed.
      - id: buildinfo
        run: echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Resolve lowercase image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.suffix }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4.4.1

      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: google-github-actions/auth@v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Log in to Artifact Registry
        run: gcloud auth configure-docker asia-south1-docker.pkg.dev --quiet

      - id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=raw,value=staging
            type=sha

      # The worker is also tagged in Artifact Registry under the commit's tag, which the Cloud Run job pins (spider-job.sh).
      - id: tags
        env:
          META_TAGS: ${{ steps.meta.outputs.tags }}
          SUFFIX: ${{ matrix.suffix }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          {
            echo "tags<<TAGS"
            echo "$META_TAGS"
            if [ "$SUFFIX" = spider-worker ]; then
              echo "asia-south1-docker.pkg.dev/$GCP_PROJECT_ID/spider/spider-worker:sha-$(git rev-parse --short HEAD)"
            fi
            echo "TAGS"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          target: ${{ matrix.target }}
          push: true
          platforms: linux/amd64
          tags: ${{ steps.tags.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ steps.buildinfo.outputs.time }}
            VITE_API_URL=${{ vars.STAGING_API_URL }}
            VITE_AUTHENTIK_URL=${{ vars.STAGING_AUTH_URL }}
            VITE_AUTHENTIK_CLIENT_ID=automatedlinkedin
            VITE_AUTHENTIK_APP_SLUG=automatedlinkedin
            VITE_AUTHENTIK_ENROLLMENT_SLUG=automatedlinkedin-enrollment
          # In GHCR rather than the Actions cache: that one holds 10 GB for the whole repository and evicts the browser layers.
          cache-from: type=registry,ref=${{ steps.image.outputs.name }}:buildcache
          cache-to: type=registry,ref=${{ steps.image.outputs.name }}:buildcache,mode=max,oci-mediatypes=true,image-manifest=true

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: staging
    permissions:
      contents: read
      # required to mint the OIDC token Workload Identity Federation exchanges
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1

      # config.env and secrets.env are git-ignored, so CI writes them back from
      # the GitHub secrets that hold the whole file.
      - name: Materialise the overlay environment files
        working-directory: deploy/overlays/staging
        run: |
          printf '%s\n' "$STAGING_CONFIG_ENV" > config.env
          printf '%s\n' "$STAGING_SECRETS_ENV" > secrets.env
        env:
          STAGING_CONFIG_ENV: ${{ secrets.STAGING_CONFIG_ENV }}
          STAGING_SECRETS_ENV: ${{ secrets.STAGING_SECRETS_ENV }}

      - uses: google-github-actions/auth@v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/get-gke-credentials@v3.0.0
        with:
          cluster_name: ${{ vars.GKE_CLUSTER }}
          location: ${{ vars.GKE_LOCATION }}
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Install kustomize
        run: |
          curl -fsSL -o kustomize.tar.gz \
            https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.7.1/kustomize_v5.7.1_linux_amd64.tar.gz
          tar -xzf kustomize.tar.gz
          sudo install kustomize /usr/local/bin/

      # Pin the immutable sha tag instead of the mutable `staging` tag, so the
      # Deployment actually changes and a rollback points at a known build.
      - name: Pin the image tags to this commit
        working-directory: deploy/overlays/staging
        run: |
          tag="sha-$(git rev-parse --short HEAD)"
          repo="ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          for image in brain brain-migrate body spider; do
            kustomize edit set image "automatedlinkedin-$image=$repo-$image:$tag"
          done

      # Smart shutdown must not switch staging off while a deploy runs. The lock lasts 30 minutes,
      # and the release step below clears it when the deploy ends.
      - name: Hold the smart-shutdown lock for this deploy
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GKE_CLUSTER: ${{ vars.GKE_CLUSTER }}
          GKE_LOCATION: ${{ vars.GKE_LOCATION }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: ./deploy/scripts/staging-power.sh lock 30

      - name: Wake staging if it is asleep
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GKE_CLUSTER: ${{ vars.GKE_CLUSTER }}
          GKE_LOCATION: ${{ vars.GKE_LOCATION }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: ./deploy/scripts/staging-power.sh ensure-awake

      - name: Apply
        env:
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          # GHCR packages are private, so the cluster needs pull credentials.
          # GHCR_PULL_TOKEN is a classic PAT with read:packages. GITHUB_TOKEN would
          # work for this job but expires when it ends, so a node replacement later
          # could no longer pull.
          if [ -z "$GHCR_PULL_TOKEN" ]; then
            echo "::error title=Missing secret::GHCR_PULL_TOKEN is not set. Add a classic PAT with read:packages as a repository secret (gh secret set GHCR_PULL_TOKEN)."
            exit 1
          fi
          kubectl create namespace automatedlinkedin --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n automatedlinkedin create secret docker-registry ghcr \
            --docker-server=ghcr.io \
            --docker-username="${{ github.actor }}" \
            --docker-password="$GHCR_PULL_TOKEN" \
            --dry-run=client -o yaml | kubectl apply -f -

          # The DNS updater (dns/cronjob.yaml) needs a Cloudflare token with DNS edit rights.
          # Without it the CronJob is applied but cannot update DNS, so warn instead of failing the deploy.
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            kubectl -n automatedlinkedin create secret generic cloudflare-dns \
              --from-literal=CF_API_TOKEN="$CLOUDFLARE_API_TOKEN" \
              --dry-run=client -o yaml | kubectl apply -f -
          else
            echo "::warning title=DNS updater not configured::CLOUDFLARE_API_TOKEN is not set, so staging DNS will not update when the node IP changes."
          fi

          kustomize build --load-restrictor LoadRestrictionsNone deploy/overlays/staging > /tmp/staging-rendered.yaml
          # Refuse to apply placeholder values (for example the base config's example database host,
          # or CHANGE_ME). These reached a live pod once when an overlay merge was lost.
          if grep -qE 'example\.invalid|CHANGE_ME' /tmp/staging-rendered.yaml; then
            echo "::error title=Placeholder in rendered staging config::The rendered staging manifests still contain placeholder values. Check deploy/overlays/staging."
            grep -nE 'example\.invalid|CHANGE_ME' /tmp/staging-rendered.yaml | cut -c1-160
            exit 1
          fi
          kubectl apply -f /tmp/staging-rendered.yaml
          kubectl -n automatedlinkedin rollout status statefulset/rabbitmq --timeout=5m
          kubectl -n automatedlinkedin rollout status deploy/brain --timeout=5m
          kubectl -n automatedlinkedin rollout status deploy/brain-worker --timeout=5m
          kubectl -n automatedlinkedin rollout status deploy/body --timeout=5m
          kubectl -n automatedlinkedin rollout status deploy/authentik-server --timeout=5m
          kubectl -n automatedlinkedin rollout status deploy/authentik-worker --timeout=5m
          kubectl -n automatedlinkedin rollout status deploy/spider-api --timeout=5m

      # The spider worker runs as a Cloud Run job now. It is deployed after the apply, and this step fails unless the job is
      # ready on this commit's image (deploy/scripts/spider-job.sh; .plan/spider-worker-cloud-run.md).
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install the Pulumi CLI
        run: |
          curl -fsSL --retry 5 --retry-delay 10 -o "$RUNNER_TEMP/pulumi.tar.gz" https://get.pulumi.com/releases/sdk/pulumi-v3.272.0-linux-x64.tar.gz
          tar -xzf "$RUNNER_TEMP/pulumi.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/pulumi" >> "$GITHUB_PATH"

      - name: Build the infra code
        working-directory: infra/cloud-run
        run: |
          npm ci
          npm run build

      - name: Deploy the spider job
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: asia-south1
          SECRETS_FILE: deploy/overlays/staging/secrets.env
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
        run: ./deploy/scripts/spider-job.sh "sha-$(git rev-parse --short HEAD)"

      - name: Release the smart-shutdown lock
        if: always()
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GKE_CLUSTER: ${{ vars.GKE_CLUSTER }}
          GKE_LOCATION: ${{ vars.GKE_LOCATION }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: ./deploy/scripts/staging-power.sh unlock
