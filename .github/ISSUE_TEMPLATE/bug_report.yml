name: Bug report
description: Report something that is not working as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Do not include passwords, tokens, or personal data from LinkedIn profiles.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `pnpm dev`
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - apps/brain (backend)
        - apps/body (frontend)
        - packages
        - Tooling / CI
        - Not sure
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Node.js and pnpm versions.
      placeholder: macOS 15, Node v25.9.0, pnpm 12.10.1
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      render: shell
