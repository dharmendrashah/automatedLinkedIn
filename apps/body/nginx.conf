server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Exact match, so the SPA fallback below never answers /health with index.html.
  location = /health {
    alias /usr/share/nginx/html/health.json;
    default_type application/json;
    add_header Cache-Control "no-store" always;
  }

  # Browsers ask for /favicon.ico on their own: a missing icon is a 404, never the app's HTML, and the icons may be kept a day.
  location ~ ^/(favicon\.ico|favicon\.svg|favicon-alert\.svg|apple-touch-icon\.png|icon-(192|512)\.png|site\.webmanifest)$ {
    add_header Cache-Control "public, max-age=86400";
    # nginx's own type list has no entry for .webmanifest; the others (ico, svg, png) are in it.
    default_type application/manifest+json;
    try_files $uri =404;
  }

  location / {
    try_files $uri /index.html;
  }
}
