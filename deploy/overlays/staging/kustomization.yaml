apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: automatedlinkedin

resources:
  - ../../base
  - dns/cronjob.yaml
  - idle-shutdown/idle-shutdown.yaml

# Deployed 2026-10-12: node pool has GKE_METADATA mode and spider-worker's GSA binding (deploy/gcp-setup.md);
# one spider-worker replica fits the node with the current workloads (.plan/spider-staging-deploy.md).
components:
  - ../../components/spider

# Replace OWNER with the lowercase GitHub owner/repo that publishes the images.
# The body image is environment specific: its VITE_* values are baked at build time,
# so staging must use the image built by .github/workflows/staging.yml.
images:
  - name: automatedlinkedin-brain
    newName: ghcr.io/dharmendrashah/automatedlinkedin-brain
    newTag: staging
  - name: automatedlinkedin-brain-migrate
    newName: ghcr.io/dharmendrashah/automatedlinkedin-brain-migrate
    newTag: staging
  - name: automatedlinkedin-body
    newName: ghcr.io/dharmendrashah/automatedlinkedin-body
    newTag: staging
  # Pinned to the commit tag by the deploy job like the others; `staging` is only the fallback for a local render.
  - name: automatedlinkedin-spider
    newName: ghcr.io/dharmendrashah/automatedlinkedin-spider
    newTag: staging
  - name: automatedlinkedin-spider-worker
    newName: ghcr.io/dharmendrashah/automatedlinkedin-spider-worker
    newTag: staging

configMapGenerator:
  - name: app-config
    behavior: merge
    envs:
      - config.env
    literals:
      # Set here, not in the git-ignored config.env, so every staging deploy has it. A real Firefox on an Xvfb display, which
      # Camoufox advises over plain headless; it costs the worker a little more CPU and memory.
      - SPIDER_HEADLESS=virtual
      # Every run keeps its video, steps, requests, logs and pages for the Sessions page, seven days, including runs that
      # went well. Off (the default) kept nothing for sign-in checks, `failures` keeps only runs that went wrong. A
      # recording shows what the browser showed.
      - SPIDER_RECORDING=always
  # Keeps app.staging.elitale.com pointed at the node's external IP (see dns/cronjob.yaml).
  # CF_ZONE_ID is the zone ID of elitale.com in Cloudflare (Overview page, right-hand side).
  # The API token is not here: the deploy job creates the cloudflare-dns secret from CLOUDFLARE_API_TOKEN.
  - name: dns-updater
    files:
      - update_dns.py=dns/update_dns.py
  - name: dns-config
    literals:
      - CF_ZONE_ID=b7c2c36fd58578c9dc212fc57d87b33b
      - RECORD_NAME=app.staging.elitale.com
  # Smart shutdown (see idle-shutdown/). Stays in dry-run until SMART_SHUTDOWN_MODE is changed to enforce.
  - name: idle-shutdown-script
    files:
      - idle_shutdown.py=idle-shutdown/idle_shutdown.py
  - name: idle-shutdown-config
    literals:
      - SMART_SHUTDOWN_ENABLED=true
      - SMART_SHUTDOWN_MODE=enforce
      - IDLE_MINUTES=45
      - ACTIVITY_WINDOW_SECONDS=600
      - GCP_PROJECT=automate-linkedin-511215
      - GKE_CLUSTER=staging-asia
      - GKE_LOCATION=asia-south1-b
      - GKE_NODE_POOL=big-pool

secretGenerator:
  - name: app-secrets
    envs:
      - secrets.env

patches:
  - path: ingress.patch.yaml

  # brain and body come from GHCR; the authentik image is public. spider-api/spider-worker are listed here too,
  # ready for when the spider component above is included (a target naming a Deployment that does not exist
  # yet is not an error, as long as the regex still matches at least one that does).
  - path: imagepullsecret.patch.yaml
    target:
      kind: Deployment
      name: (brain|brain-worker|body|spider-api|spider-worker)

  # One Spot node, so every workload must tolerate the Spot taint and stay single-replica.
  - path: spot-toleration.patch.yaml
    target:
      kind: Deployment
  - path: spot-toleration.patch.yaml
    target:
      kind: StatefulSet
