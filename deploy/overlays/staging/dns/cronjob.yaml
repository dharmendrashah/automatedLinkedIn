apiVersion: v1
kind: ServiceAccount
metadata:
  name: dns-updater
---
# Scoped to read-only on the single resource it needs: its own node's external IP.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dns-updater-read-nodes
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dns-updater-read-nodes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dns-updater-read-nodes
subjects:
  - kind: ServiceAccount
    name: dns-updater
    namespace: automatedlinkedin
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: staging-dns-updater
spec:
  # Every 5 minutes: a node replacement changes its external IP, and the record follows within one run.
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 120
      template:
        spec:
          restartPolicy: Never
          serviceAccountName: dns-updater
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
          containers:
            - name: updater
              image: python:3.14-alpine
              command: ["python3", "/app/update_dns.py"]
              env:
                - name: PYTHONDONTWRITEBYTECODE
                  value: "1"
                - name: NODE_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: spec.nodeName
                - name: CF_API_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: cloudflare-dns
                      key: CF_API_TOKEN
              envFrom:
                - configMapRef:
                    name: dns-config
              volumeMounts:
                - name: script
                  mountPath: /app
                  readOnly: true
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
          volumes:
            - name: script
              configMap:
                name: dns-updater
