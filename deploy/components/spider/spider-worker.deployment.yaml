apiVersion: apps/v1
kind: Deployment
metadata:
  name: spider-worker
  labels:
    app.kubernetes.io/name: spider-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: spider-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spider-worker
    spec:
      # GKE Workload Identity gives GCS access with no mounted key file (deploy/gcp-setup.md).
      serviceAccountName: spider-worker
      containers:
        - name: spider-worker
          # Built from the Dockerfile's `worker` target; the published repo name is `-spider-worker`.
          image: automatedlinkedin-spider-worker
          imagePullPolicy: IfNotPresent
          ports:
            # Read by brain for the Service status page. It is not a Kubernetes probe: a crashed worker already exits and
            # restarts, and a probe that depended on the queue or the bucket would restart it for outages it cannot fix.
            - name: health
              containerPort: 3003
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          env:
            # Same two secret keys the broker starts with, so they cannot drift apart from brain's.
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: RABBITMQ_DEFAULT_USER
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: RABBITMQ_DEFAULT_PASS
            - name: RABBITMQ_URL
              value: amqp://$(RABBITMQ_DEFAULT_USER):$(RABBITMQ_DEFAULT_PASS)@rabbitmq:5672/automatedlinkedin
          # Only the health port above, read by brain, and no probes: a crash exits the process and the container restart brings a
          # clean worker back, the same behaviour worker.ts already relies on for a lost broker connection.
          resources:
            requests:
              # Measured against the real staging node (2026-10-12): GKE_METADATA mode's own
              # gke-metadata-server daemonset eats ~100m CPU that wasn't accounted for in the
              # original estimate, so 500m no longer fit. 400m schedules; the 1-CPU limit still
              # lets it burst since Camoufox/Firefox usage is bursty, not sustained.
              cpu: 400m
              # A sign-in run peaked at 1.7Gi and one was killed at the old 2Gi limit (2026-10-19).
              memory: 1536Mi
            limits:
              cpu: '1'
              memory: 3Gi
          securityContext:
            # Numeric UID is required: the image declares `USER node`, and kubelet
            # cannot verify a non-numeric user against runAsNonRoot.
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            # No readOnlyRootFilesystem, unlike brain and spider-api: Camoufox writes its GeoIP database and
            # Firefox writes a profile under the container's own filesystem at run time.
            capabilities:
              drop: [ALL]
          volumeMounts:
            # Firefox/Camoufox needs more shared memory than the container default, same as compose's shm_size.
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
