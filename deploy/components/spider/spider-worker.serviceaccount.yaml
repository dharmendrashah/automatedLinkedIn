# Bound to a GCP service account via GKE Workload Identity (see deploy/gcp-setup.md), so the worker never
# carries a mounted key file. The overlay's annotation is the one that actually binds it; this is the base shape.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spider-worker
  annotations:
    iam.gke.io/gcp-service-account: spider-worker-gcs@automate-linkedin-511215.iam.gserviceaccount.com
  labels:
    app.kubernetes.io/name: spider-worker
