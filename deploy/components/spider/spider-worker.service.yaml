apiVersion: v1
kind: Service
metadata:
  name: spider-worker
  labels:
    app.kubernetes.io/name: spider-worker
spec:
  # Internal only: brain reads the worker's health for the Service status page. Nothing outside the cluster calls this.
  type: ClusterIP
  selector:
    app.kubernetes.io/name: spider-worker
  ports:
    - name: health
      port: 3003
      targetPort: health
