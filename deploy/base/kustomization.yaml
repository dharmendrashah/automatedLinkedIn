apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: automatedlinkedin

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: automatedlinkedin

resources:
  - namespace.yaml
  - brain.deployment.yaml
  - brain.service.yaml
  - body.deployment.yaml
  - body.service.yaml
  - authentik-server.deployment.yaml
  - authentik-server.service.yaml
  - authentik-worker.deployment.yaml
  - ingress.yaml

configMapGenerator:
  - name: app-config
    envs:
      - config.env

  # Single source of truth: the same blueprint compose mounts into the worker.
  # Reading it from infra/ needs `--load-restrictor LoadRestrictionsNone` (see deploy/README.md).
  - name: authentik-blueprints
    files:
      - automatedlinkedin.yaml=../../infra/authentik/blueprints/automatedlinkedin.yaml

# `app-secrets` is produced by each overlay from its own git-ignored secrets.env,
# so the base on its own is not directly deployable.
