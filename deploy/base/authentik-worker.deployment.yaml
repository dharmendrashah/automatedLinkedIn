apiVersion: apps/v1
kind: Deployment
metadata:
  name: authentik-worker
  labels:
    app.kubernetes.io/name: authentik-worker
  # How this workload appears on the Service status page. It has no web address, so the page reads Kubernetes' own
  # verdict (a ready pod, which the probe below decides). A new service needs nothing but annotations like these.
  annotations:
    status.automatedlinkedin/title: Sign-in worker
    status.automatedlinkedin/group: Sign-in
    status.automatedlinkedin/description: Background work for sign-in
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: authentik-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: authentik-worker
    spec:
      containers:
        - name: worker
          image: ghcr.io/goauthentik/server:2026.8.3
          args: [worker]
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            - name: data
              mountPath: /data
            - name: blueprints
              mountPath: /blueprints/custom
              readOnly: true
          # Same reasoning as the server: the worker waits on the same first-boot
          # migrations before it reports healthy.
          startupProbe:
            exec:
              command: [ak, healthcheck]
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 360
          livenessProbe:
            exec:
              command: [ak, healthcheck]
            periodSeconds: 30
            timeoutSeconds: 10
          # The limit stays well above the request: applying blueprints spikes memory
          # and a tight limit turns into an OOMKill loop.
          resources:
            requests:
              cpu: 100m
              memory: 768Mi
            limits:
              memory: 1536Mi
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
        - name: data
          emptyDir: {}
        - name: blueprints
          configMap:
            name: authentik-blueprints
