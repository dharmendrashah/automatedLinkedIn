apiVersion: apps/v1
kind: Deployment
metadata:
  name: authentik-server
  labels:
    app.kubernetes.io/name: authentik-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: authentik-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: authentik-server
    spec:
      containers:
        - name: server
          image: ghcr.io/goauthentik/server:2026.8.3
          args: [server]
          ports:
            - name: http
              containerPort: 9000
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          volumeMounts:
            # compose sets shm_size: 512mb; this is the Kubernetes equivalent
            - name: dshm
              mountPath: /dev/shm
            - name: data
              mountPath: /data
          # First boot runs authentik's full Django migration set, which takes many
          # minutes and answers /-/health/live/ with 500 until it finishes. The budget
          # here is 60 minutes, sized for a high-latency (cross-region) database; a
          # tighter one kills the pod mid-migration and it restarts into the same
          # migration forever. Co-locate the cluster with the database and this
          # finishes in a couple of minutes.
          startupProbe:
            httpGet:
              path: /-/health/ready/
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 360
          readinessProbe:
            httpGet:
              path: /-/health/ready/
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          # TCP, not HTTP: /-/health/live/ depends on the database, so a DB blip
          # would restart the pod. Liveness should only catch a hung process.
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 200m
              memory: 1Gi
            limits:
              memory: 1536Mi
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
        - name: data
          emptyDir: {}
