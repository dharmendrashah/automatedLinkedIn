apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  labels:
    app.kubernetes.io/name: rabbitmq
spec:
  selector:
    app.kubernetes.io/name: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: amqp
    # Not exposed through the ingress; reach it with `kubectl port-forward svc/rabbitmq 15672`.
    - name: management
      port: 15672
      targetPort: management
