apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: automatedlinkedin
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 10m
spec:
  ingressClassName: nginx
  rules:
    # Hosts are placeholders; every overlay patches them to its real domain.
    - host: app.staging.elitale.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: body
                port:
                  name: http
    - host: api.staging.elitale.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: brain
                port:
                  name: http
    - host: auth.staging.elitale.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: authentik-server
                port:
                  name: http
