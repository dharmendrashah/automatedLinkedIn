apiVersion: apps/v1
kind: Deployment
metadata:
  name: brain
  labels:
    app.kubernetes.io/name: brain
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: brain
  template:
    metadata:
      labels:
        app.kubernetes.io/name: brain
    spec:
      # Migrations run as an init container rather than a separate Job: it guarantees
      # brain never starts against an unmigrated schema, `migrate deploy` is idempotent
      # so re-running on every restart is safe, and there is no Job name collision on
      # re-apply. `replicas` stays at 1 so two migrations cannot race.
      initContainers:
        - name: migrate
          image: automatedlinkedin-brain-migrate
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: app-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 768Mi
      containers:
        - name: brain
          image: automatedlinkedin-brain
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3001
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
