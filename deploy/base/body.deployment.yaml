apiVersion: apps/v1
kind: Deployment
metadata:
  name: body
  labels:
    app.kubernetes.io/name: body
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: body
  template:
    metadata:
      labels:
        app.kubernetes.io/name: body
    spec:
      containers:
        # The SPA bakes its VITE_* configuration at build time, so this image is
        # environment specific. Overlays must point at the image built for them.
        - name: body
          image: automatedlinkedin-body
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [CHOWN, SETGID, SETUID, NET_BIND_SERVICE]
