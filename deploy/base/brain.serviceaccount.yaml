# Bound to a GCP service account via GKE Workload Identity (see deploy/gcp-setup.md, "Session recordings"), so brain
# can sign a short-lived link to a session recording without a mounted key file.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: brain
  annotations:
    iam.gke.io/gcp-service-account: brain-recording-links@automate-linkedin-511215.iam.gserviceaccount.com
  labels:
    app.kubernetes.io/name: brain
