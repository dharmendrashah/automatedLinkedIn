# Smart shutdown RBAC. Applied once by a cluster admin, not by CI: the CI account cannot create RBAC objects.
#   kubectl apply -f deploy/cluster/idle-shutdown-rbac.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: idle-shutdown
  namespace: automatedlinkedin
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: idle-shutdown
  namespace: automatedlinkedin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: idle-shutdown
subjects:
  - kind: ServiceAccount
    name: idle-shutdown
---
# Reads the nodes of the staging pool, to check that exactly one is running before it acts.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: idle-shutdown-read-nodes
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: idle-shutdown-read-nodes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: idle-shutdown-read-nodes
subjects:
  - kind: ServiceAccount
    name: idle-shutdown
    namespace: automatedlinkedin
