packages:
  # all packages in subdirs of packages/ and apps/
  - 'packages/*'
  - 'apps/*'
  - '@react-vite-trpc/*'
allowBuilds:
  '@prisma/engines': true
  prisma: true
  '@swc/core': true
  esbuild: true
  protobufjs: true
# Remove when express itself needs body-parser >=2.4.0 (plan 002).
overrides:
  body-parser: '>=2.4.0'
  basic-ftp: '>=6.2.1'
minimumReleaseAgeExclude:
  - dotenv@18.0.7
  - express@5.3.0
  - '@rollup/rollup-linux-ppc64-gnu@4.64.3'
  - '@rollup/rollup-linux-s390x-gnu@4.64.3'
  - '@rollup/rollup-win32-x64-msvc@4.64.3'
