x-database-url: &database-url postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-automatedlinkedin}

# The password sits inside a URL, so keep it URL-safe (letters and digits, for example `openssl rand -hex 16`).
x-rabbitmq-url: &rabbitmq-url amqp://${RABBITMQ_DEFAULT_USER:-automatedlinkedin}:${RABBITMQ_DEFAULT_PASS:-automatedlinkedin}@rabbitmq:5672/${RABBITMQ_DEFAULT_VHOST:-automatedlinkedin}

x-mail-server: &mail-server
  AUTHENTIK_EMAIL__HOST: ${AUTHENTIK_EMAIL__HOST:-mailpit}
  AUTHENTIK_EMAIL__PORT: ${AUTHENTIK_EMAIL__PORT:-1025}
  AUTHENTIK_EMAIL__USE_SSL: ${AUTHENTIK_EMAIL__USE_SSL:-false}

x-authentik: &authentik
  image: ${AUTHENTIK_IMAGE:-ghcr.io/goauthentik/server}:${AUTHENTIK_TAG:-2026.8.3}
  env_file:
    - path: .env
      required: false
  environment:
    AUTHENTIK_POSTGRESQL__HOST: postgres
    AUTHENTIK_POSTGRESQL__NAME: ${AUTHENTIK_PG_DB:-authentik}
    AUTHENTIK_POSTGRESQL__USER: ${AUTHENTIK_PG_USER:-authentik}
    AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_PG_PASS:-authentik}
    AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:-dev-only-change-me-dev-only-change-me-dev-only-change-me}
    # Outbound mail for sign-up verification and password reset. Defaults send to the local
    # Mailpit catcher (http://localhost:8025). To use Resend, set the AUTHENTIK_EMAIL__* values in .env.
    <<: *mail-server
    AUTHENTIK_EMAIL__USERNAME: ${AUTHENTIK_EMAIL__USERNAME:-}
    AUTHENTIK_EMAIL__PASSWORD: ${AUTHENTIK_EMAIL__PASSWORD:-}
    AUTHENTIK_EMAIL__USE_TLS: ${AUTHENTIK_EMAIL__USE_TLS:-false}
    AUTHENTIK_EMAIL__TIMEOUT: ${AUTHENTIK_EMAIL__TIMEOUT:-10}
    AUTHENTIK_EMAIL__FROM: ${AUTHENTIK_EMAIL__FROM:-no-reply@automatedlinkedin.local}
  depends_on:
    postgres:
      condition: service_healthy
  shm_size: 512mb
  restart: unless-stopped

services:
  # Local mail catcher. authentik sends sign-up verification and password reset e-mails here.
  # Web UI: http://localhost:8025. Nothing is delivered outside this machine.
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:8025:8025"
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-automatedlinkedin}
      AUTHENTIK_PG_USER: ${AUTHENTIK_PG_USER:-authentik}
      AUTHENTIK_PG_PASS: ${AUTHENTIK_PG_PASS:-authentik}
      AUTHENTIK_PG_DB: ${AUTHENTIK_PG_DB:-authentik}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Message broker for background work. Management UI: http://localhost:15672 (sign in with the
  # RABBITMQ_DEFAULT_USER and RABBITMQ_DEFAULT_PASS below). Both ports bind to this machine only.
  # The user, password and vhost are created on first start; changing them later needs a new volume
  # (`docker compose down -v` also wipes the databases, so remove only `rabbitmq-data`).
  rabbitmq:
    image: rabbitmq:4.3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-automatedlinkedin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-automatedlinkedin}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_DEFAULT_VHOST:-automatedlinkedin}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: apps/brain/Dockerfile
      target: migrate
    environment:
      DATABASE_URL: *database-url
    depends_on:
      postgres:
        condition: service_healthy

  brain:
    build:
      context: .
      dockerfile: apps/brain/Dockerfile
    environment: &brain-environment
      PORT: 3001
      DATABASE_URL: *database-url
      AUTHENTIK_ISSUER: ${AUTHENTIK_ISSUER:-http://localhost:9000/application/o/automatedlinkedin/}
      AUTHENTIK_CLIENT_ID: ${AUTHENTIK_CLIENT_ID:-automatedlinkedin}
      AUTHENTIK_INTERNAL_URL: http://authentik-server:9000
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      RABBITMQ_URL: *rabbitmq-url
      # NODE_ENV is production in the image, so the key has no built-in default there.
      # This is the public development key: never reuse it outside local development.
      LINKEDIN_CRED_ENC_KEY: ${LINKEDIN_CRED_ENC_KEY:-pqaZGClH/kqxNTLoLT4c0lMTloNIi2At3Jzz9a2rkIQ=}
      IPINFO_TOKEN: ${IPINFO_TOKEN:-dev-ipinfo-token}
      ABUSEIPDB_API_KEY: ${ABUSEIPDB_API_KEY:-}
      # Where the Sessions page finds recordings. Empty: no recordings. Signing links needs service account
      # credentials, which this container does not have: run brain with `pnpm dev` to see recordings locally
      # (see apps/brain/.env.example).
      SPIDER_GCS_BUCKET: ${SPIDER_GCS_BUCKET:-}
      SESSION_RECORDING_RETENTION_DAYS: ${SESSION_RECORDING_RETENTION_DAYS:-7}
      # The Service status page connects to the mail server authentik uses and reads its greeting (nothing is sent).
      # The other modules are found by their service names, which are the defaults.
      <<: *mail-server
    ports:
      - "3001:3001"
    depends_on:
      migrate:
        condition: service_completed_successfully
      # Started, not healthy: brain keeps serving while the broker is down.
      rabbitmq:
        condition: service_started
    restart: unless-stopped

  # The same image as brain, started as its own process: it applies the spider's answers and runs the scheduled jobs, so
  # the API only serves requests. Scale consumers with more replicas of WORKER_ROLES=consumers; keep jobs in one.
  brain-worker:
    build:
      context: .
      dockerfile: apps/brain/Dockerfile
    command: ["node", "dist/src/worker/main.js"]
    environment:
      <<: *brain-environment
      WORKER_ROLES: ${WORKER_ROLES:-consumers,jobs}
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_started
    restart: unless-stopped

  body:
    build:
      context: .
      dockerfile: apps/body/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3001}
        VITE_AUTHENTIK_URL: ${VITE_AUTHENTIK_URL:-http://localhost:9000}
        VITE_AUTHENTIK_CLIENT_ID: ${VITE_AUTHENTIK_CLIENT_ID:-automatedlinkedin}
        VITE_AUTHENTIK_APP_SLUG: ${VITE_AUTHENTIK_APP_SLUG:-automatedlinkedin}
        VITE_AUTHENTIK_ENROLLMENT_SLUG: ${VITE_AUTHENTIK_ENROLLMENT_SLUG:-automatedlinkedin-enrollment}
    ports:
      - "3000:80"
    depends_on:
      - brain
    restart: unless-stopped

  # Asynchronous scraper. Opt in with `docker compose --profile spider up -d spider-api spider-worker`.
  # The API takes tasks on http://localhost:3002 and queues them in RabbitMQ; the worker runs them in Camoufox
  # and writes the raw results and each account's session to a Google Cloud Storage bucket. Only the hosts in
  # SPIDER_ALLOWED_HOSTS can be visited, robots.txt is honoured except for SPIDER_ROBOTS_EXEMPT_HOSTS, actions on
  # one host keep a fixed gap (SPIDER_MIN_DELAY_MS) and only one task runs per account at a time. The worker also
  # runs the named tasks brain asks it to (tasks.run: browser-detection, linkedin-login) and answers on tasks.done.
  spider-api:
    profiles: ["spider"]
    build:
      context: .
      dockerfile: apps/spider/Dockerfile
      target: api
    environment:
      PORT: 3002
      RABBITMQ_URL: *rabbitmq-url
      SPIDER_ALLOWED_HOSTS: ${SPIDER_ALLOWED_HOSTS:-localhost,host.docker.internal,linkedin.com}
    ports:
      - "127.0.0.1:3002:3002"
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  spider-worker:
    profiles: ["spider"]
    build:
      context: .
      dockerfile: apps/spider/Dockerfile
      target: worker
    init: true
    # Firefox needs more shared memory than the container default.
    shm_size: 1gb
    environment:
      RABBITMQ_URL: *rabbitmq-url
      SPIDER_ALLOWED_HOSTS: ${SPIDER_ALLOWED_HOSTS:-localhost,host.docker.internal,linkedin.com,deviceandbrowserinfo.com,pixelscan.net}
      SPIDER_ROBOTS_EXEMPT_HOSTS: ${SPIDER_ROBOTS_EXEMPT_HOSTS:-linkedin.com}
      # Must equal brain's key: it opens the sealed credentials brain sends for account validation.
      LINKEDIN_CRED_ENC_KEY: ${LINKEDIN_CRED_ENC_KEY:-pqaZGClH/kqxNTLoLT4c0lMTloNIi2At3Jzz9a2rkIQ=}
      SPIDER_VALIDATION_MODE: ${SPIDER_VALIDATION_MODE:-full}
      SPIDER_GCS_BUCKET: ${SPIDER_GCS_BUCKET:-}
      SPIDER_MIN_DELAY_MS: ${SPIDER_MIN_DELAY_MS:-2000}
      # Local runs record by default (steps, requests, console and a video, kept in the bucket under recordings/).
      SPIDER_RECORDING: ${SPIDER_RECORDING:-always}
      SPIDER_RECORD_VIDEO: ${SPIDER_RECORD_VIDEO:-true}
      GOOGLE_APPLICATION_CREDENTIALS: /gcp/credentials.json
    volumes:
      # Application Default Credentials from `gcloud auth application-default login`, read-only.
      - ${SPIDER_GCP_CREDENTIALS:-${HOME}/.config/gcloud/application_default_credentials.json}:/gcp/credentials.json:ro
    depends_on:
      rabbitmq:
        condition: service_healthy
    # A lost broker connection ends the worker on purpose; the restart brings a clean one back.
    restart: unless-stopped

  authentik-server:
    <<: *authentik
    command: server
    ports:
      - "127.0.0.1:${AUTHENTIK_PORT_HTTP:-9000}:9000"
    volumes:
      - authentik-data:/data

  authentik-worker:
    <<: *authentik
    command: worker
    volumes:
      - authentik-data:/data
      - ./infra/authentik/blueprints:/blueprints/custom:ro

volumes:
  postgres-data:
  rabbitmq-data:
  authentik-data:
